# PrintPrice OS Control Plane - Production Industrial Preflight Orchestration
# Fully Hardened Build Infrastructure for Preflight Engine Fleet
version: "3.8"

services:
  ppos-preflight-service:
    build:
      context: ../
      dockerfile: ppos-shared-infra/recipes/ppos-preflight-service/Dockerfile
    image: ppos/preflight-service:production
    container_name: ppos-preflight-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      PPOS_SERVICE_PORT: 8001
      DATABASE_URL: mysql://ppos_user:ppos_pass@ppos-mysql:3306/printprice_os
      MYSQL_HOST: ppos-mysql
      MYSQL_USER: ppos_user
      MYSQL_PASSWORD: ppos_pass
      MYSQL_DATABASE: printprice_os
      REDIS_HOST: ppos-redis
      REDIS_PORT: 6379
      ADMIN_API_KEY: ${ADMIN_API_KEY:-ppos-production-secure-key}
      PPOS_REGION_ID: eu-central-1
      PPOS_UPLOADS_DIR: /tmp/ppos-preflight
      NODE_ENV: production
    volumes:
      - ppos-uploads:/tmp/ppos-preflight
    networks:
      - ppos-network
    healthcheck:
      test: ["CMD", "node", "ppos-shared-infra/scripts/verify-industrial-tools.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  ppos-preflight-worker:
    build:
      context: ../
      dockerfile: ppos-shared-infra/recipes/ppos-preflight-worker/Dockerfile
    image: ppos/preflight-worker:production
    container_name: ppos-preflight-worker
    restart: always
    ports:
      - "8002:8002"
    environment:
      HEALTH_PORT: 8002
      DATABASE_URL: mysql://ppos_user:ppos_pass@ppos-mysql:3306/printprice_os
      MYSQL_HOST: ppos-mysql
      MYSQL_USER: ppos_user
      MYSQL_PASSWORD: ppos_pass
      MYSQL_DATABASE: printprice_os
      REDIS_HOST: ppos-redis
      REDIS_PORT: 6379
      PPOS_REGION_ID: eu-central-1
      PPOS_UPLOADS_DIR: /tmp/ppos-preflight
      NODE_ENV: production
    volumes:
      - ppos-uploads:/tmp/ppos-preflight
    networks:
      - ppos-network
    healthcheck:
      test: ["CMD", "node", "ppos-shared-infra/scripts/verify-industrial-tools.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  ppos-uploads:

networks:
  ppos-network:
    external: true
    name: printprice-os_ppos-network
